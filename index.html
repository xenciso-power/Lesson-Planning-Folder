<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mr. Enciso’s Scholastic Batch – Lesson Planner</title>
  <style>
    :root {
      --navy: #1F4E79;
      --navy-dark: #163A5F;
      --gold: #D4AF37;
      --gold-light: #F0D78C;
      --bg: #0F172A;
      --surface: #1E293B;
      --surface-2: #334155;
      --text: #F1F5F9;
      --text-muted: #94A3B8;
      --border: #475569;
      --success: #22C55E;
      --danger: #EF4444;
      --radius: 10px;
      --shadow: 0 4px 20px rgba(0,0,0,0.4);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
      min-height: 100vh;
    }
    .header {
      background: linear-gradient(135deg, var(--navy-dark), var(--navy));
      border-bottom: 3px solid var(--gold);
      padding: 0.75rem 1.25rem;
      display: flex;
      align-items: center;
      gap: 1rem;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: var(--shadow);
    }
    .logo-img {
      width: 56px;
      height: 56px;
      flex-shrink: 0;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid var(--gold);
      background: #000;
    }
    .header-text h1 {
      font-size: 1.25rem;
      font-weight: 700;
      color: white;
    }
    .header-text p {
      font-size: 0.8rem;
      color: var(--gold-light);
    }
    .header-actions {
      margin-left: auto;
      display: flex;
      gap: 0.5rem;
    }
    button {
      background: var(--surface-2);
      color: var(--text);
